[package]
name = "oxideav-indeo"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-indeo"
authors = ["Mark Karpeles"]
description = "Pure-Rust Intel Indeo video codec family (Indeo 2 / 3 / 4 / 5) for the oxideav framework"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-indeo"
keywords = ["multimedia", "video", "indeo", "rt21", "codec"]
categories = ["multimedia::encoding", "multimedia::video"]
exclude = ["/tests", "/fuzz"]

[dependencies]
oxideav-core = "0.1"

# PearTube fork: build and test against the PearTube oxideav-core fork the
# player uses (`PixelFormat::Yuv410P`, `Decoder::output_video_dimensions` /
# `output_pixel_format`), at the revision the player pins.
[patch.crates-io]
oxideav-core = { git = "https://github.com/ayooooo123/oxideav-core", rev = "9a314bf862480d019dc1133847ff6262d14ba628" }
